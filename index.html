<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4a7fe0" />
  <title>Tour de Boundy</title>
  
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="hud-top">
      <div class="pill" id="hud-time">0:00.0</div>
      <div class="pill" id="hud-dist">0 m</div>
      <div class="pill" id="hud-yog">🥛 0</div>
      <div class="pill" id="hud-speed">0 km/h</div>
      <div id="stamina"><div id="stamina-fill"></div><span>STAMINA</span></div>
    </div>
    <div id="garmin" class="hidden" title="Tap to ignore">
      <div class="garmin-face">
        <div class="garmin-title" id="garmin-title">RECOVERY</div>
        <div class="garmin-msg" id="garmin-msg">72 HRS</div>
      </div>
      <div class="garmin-hint">tap to ignore</div>
    </div>
    <button id="btn-pause" class="pill">II</button>
  </div>

  <div id="touch" class="hidden">
    <div class="touch-left">
      <button data-key="leanBack">↺<small>BACK</small></button>
      <button data-key="leanFwd">↻<small>FWD</small></button>
    </div>
    <div class="touch-right">
      <button data-key="brake">◀◀<small>BRAKE</small></button>
      <button data-key="sprint" class="sprint">⚡<small>SPRINT</small></button>
      <div class="stack">
        <button data-key="hop" class="hop">⤒<small>HOP</small></button>
        <button data-key="pedal" class="pedal">▶▶<small>PEDAL</small></button>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div>📱↻</div>
    <p>Turn your phone sideways to race</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
